<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg_cat1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#241B2E"/>
      <stop offset="100%" stop-color="#0E0B14"/>
    </radialGradient>
    <linearGradient id="tabby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C8879"/>
      <stop offset="100%" stop-color="#6E5D50"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg_cat1)"/>
  <rect x="10" y="10" width="380" height="380" rx="12" fill="none" stroke="#352843" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Cat Shoulders -->
  <path d="M100 380 Q140 300 170 280 Q200 275 230 280 Q260 300 300 380 Z" fill="#6E5D50"/>

  <!-- Triangular Pointed Cat Ears -->
  <polygon points="110,190 95,90 175,135" fill="#54453A"/>
  <polygon points="115,180 105,105 165,140" fill="#E8B4B8" opacity="0.8"/>

  <polygon points="290,190 305,90 225,135" fill="#54453A"/>
  <polygon points="285,180 295,105 235,140" fill="#E8B4B8" opacity="0.8"/>

  <!-- Head Base -->
  <ellipse cx="200" cy="205" rx="80" ry="70" fill="url(#tabby)"/>

  <!-- Tabby Forehead Stripes ("M" pattern) -->
  <path d="M180 155 L190 175 L200 155 L210 175 L220 155" stroke="#3D3128" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M170 170 L180 185" stroke="#3D3128" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M230 170 L220 185" stroke="#3D3128" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Feline Almond Eyes with Slit Pupils -->
  <path d="M142 195 Q160 182 178 195 Q160 208 142 195 Z" fill="#9AE6B4"/>
  <ellipse cx="160" cy="195" rx="3" ry="7" fill="#1A202C"/>
  <circle cx="158" cy="193" r="1.5" fill="#FFFFFF"/>

  <path d="M222 195 Q240 182 258 195 Q240 208 222 195 Z" fill="#9AE6B4"/>
  <ellipse cx="240" cy="195" rx="3" ry="7" fill="#1A202C"/>
  <circle cx="238" cy="193" r="1.5" fill="#FFFFFF"/>

  <!-- Small Triangular Pinkish Cat Nose -->
  <polygon points="193,222 207,222 200,230" fill="#D58A94"/>
  <line x1="200" y1="230" x2="200" y2="238" stroke="#3D3128" stroke-width="1.5"/>
  <path d="M190 238 Q200 243 210 238" stroke="#3D3128" stroke-width="1.5" fill="none"/>

  <!-- Fine Tactile Whiskers (Vibrissae) -->
  <line x1="185" y1="235" x2="110" y2="225" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>
  <line x1="185" y1="238" x2="105" y2="240" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>
  <line x1="185" y1="242" x2="115" y2="255" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>

  <line x1="215" y1="235" x2="290" y2="225" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>
  <line x1="215" y1="238" x2="295" y2="240" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>
  <line x1="215" y1="242" x2="285" y2="255" stroke="#E2E8F0" stroke-width="1.2" opacity="0.8"/>

  <!-- Metadata Tag -->
  <rect x="20" y="20" width="105" height="22" rx="4" fill="#0B0D14" opacity="0.85"/>
  <text x="26" y="35" font-family="JetBrains Mono, monospace" font-size="10" fill="#55E6D0" letter-spacing="1">SAMPLE: CAT_01</text>
  <text x="20" y="375" font-family="JetBrains Mono, monospace" font-size="10" fill="#687184">CLASS: FELIS_CATUS</text>
</svg>
