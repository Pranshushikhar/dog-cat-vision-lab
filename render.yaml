services:
  - type: web
    name: pawvision-ai-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-prod.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
